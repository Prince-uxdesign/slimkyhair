<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Wishlist | Slimky Hair</title>
  <meta name="description" content="Save your favourite Slimky Hair botanical formulations and come back to them whenever you&#x27;re ready.">
  <meta name="robots" content="noindex, nofollow">

  
    <!-- Social-share image: assets/og/og-default.jpg is the interim branded 1200x630 asset (brand colours + wordmark; no product/stock imagery). Replace that file with the final branded asset using the same filename &mdash; no HTML changes needed. -->
  <meta property="og:site_name" content="Slimky Hair">
  <meta property="og:locale" content="en_US">
  <meta property="og:title" content="Your Wishlist | Slimky Hair">
  <meta property="og:description" content="Save your favourite Slimky Hair botanical formulations and come back to them whenever you&#x27;re ready.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://slimkyhair.com/account/wishlist/">
  <meta property="og:image" content="https://slimkyhair.com/assets/og/og-default.jpg">
  <meta property="og:image:secure_url" content="https://slimkyhair.com/assets/og/og-default.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Slimky Hair — Botanical Hair Science">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Your Wishlist | Slimky Hair">
  <meta name="twitter:description" content="Save your favourite Slimky Hair botanical formulations and come back to them whenever you&#x27;re ready.">
  <meta name="twitter:image" content="https://slimkyhair.com/assets/og/og-default.jpg">
  <meta name="twitter:image:alt" content="Slimky Hair — Botanical Hair Science">

<!-- Favicon / Icons -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
  
  <!-- Master Stylesheets -->
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/components/account.css">
</head>
<body class="theme-light">

  <!-- Header -->
  <header class="header sticky-header" id="main-header" role="banner">
    <div class="container header-inner" style="justify-content: space-between;">
      <a href="../../" class="header-brand" aria-label="Slimky Hair Home">
        <span class="brand-title">SLIMKY HAIR</span>
        <span class="brand-subtitle">African Botanical Science</span>
      </a>

      <div style="display: flex; align-items: center; gap: 16px;">
        <a href="../../#essentials-collection" class="btn-outline btn-sm" style="text-decoration: none;">
          Explore Formulations
        </a>

        <!-- Cart Trigger -->
        <button type="button" class="btn-icon trigger-cart" aria-label="Shopping Bag">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="20" height="20">
            <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
            <path d="M3 6h18"/>
            <path d="M16 10a4 4 0 0 1-8 0"/>
          </svg>
          <span class="btn-icon-badge cart-count-val">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Cart Drawer Component Container -->
  <aside class="drawer drawer-right" id="cart-drawer" aria-label="Shopping Bag" aria-hidden="true">
    <div class="drawer-header">
      <h2 class="drawer-title">Shopping Bag (<span class="cart-count-val">0</span>)</h2>
      <button type="button" class="btn-icon" id="cart-drawer-close" aria-label="Close Shopping Bag">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="20" height="20"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="drawer-body">
      <div id="cart-items-container">
        <!-- Rendered by cart component -->
      </div>
    </div>
    <div class="drawer-footer">
      <div style="display: flex; justify-content: space-between; margin-bottom: 1rem; font-family: var(--font-sans); font-size: 0.875rem;">
        <span style="color: var(--color-text-muted);">Estimated Subtotal</span>
        <span id="cart-subtotal-val" style="font-weight: 600;">₦0</span>
      </div>
      <a href="../../checkout/" class="btn btn-primary btn-full" style="display: flex; align-items: center; justify-content: center; text-decoration: none;">Proceed to Checkout</a>
    </div>
  </aside>

  <div class="drawer-backdrop"></div>

  <main class="account-page-main" id="main-content">
    <div class="container account-container">
      
      <!-- Breadcrumbs -->
      <nav aria-label="Breadcrumbs" class="checkout-breadcrumbs" style="margin-bottom: 24px;">
        <a href="../../">Home</a>
        <span class="checkout-breadcrumbs-sep">/</span>
        <a href="../">My Account</a>
        <span class="checkout-breadcrumbs-sep">/</span>
        <span class="checkout-breadcrumbs-current">Wishlist</span>
      </nav>

      <!-- Account 2-Column Responsive Layout -->
      <div class="account-layout">
        
        <!-- Left: Desktop Sidebar Navigation -->
        <div id="account-sidebar-mount"></div>

        <!-- Right: Main Account Content Panel -->
        <div class="account-content-panel">
          
          <!-- Mobile & Tablet Horizontal Pill Navigation -->
          <div id="account-mobile-nav-mount"></div>

          <!-- Wishlist Mount Box -->
          <div class="account-card-box" id="account-wishlist-mount">
            <!-- Dynamically hydrated by account-wishlist.js -->
          </div>

        </div>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="footer" role="contentinfo" style="border-top: 1px solid var(--color-border-subtle); padding: 40px 0; background: var(--color-bg-primary); text-align: center; margin-top: 60px;">
    <div class="container">
      <p style="font-size: 0.8125rem; color: var(--color-text-secondary); margin-bottom: 8px;">
        © 2026 Slimky Hair. All rights reserved. African Botanical Formulations.
      </p>
      <div style="display: flex; justify-content: center; gap: 20px; font-size: 0.8125rem;">
        <a href="../../privacy/" style="color: var(--color-text-secondary);">Privacy Policy</a>
        <a href="../../terms/" style="color: var(--color-text-secondary);">Terms of Service</a>
        <a href="../../contact/" style="color: var(--color-text-secondary);">Client Care</a>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script type="module" src="../../js/account-wishlist.js"></script>
</body>
</html>
